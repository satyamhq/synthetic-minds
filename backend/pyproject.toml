[project]
name = "synthetic-minds-backend"
version = "0.1.0"
description = "Synthetic Minds - A multi-agent synthetic-world simulation and intelligence platform for modeling interactions between autonomous AI agents and exploring possible outcomes."
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Synthetic Minds Contributors" }
]

dependencies = [
    # Core Framework
    "flask>=3.0.0",
    "flask-cors>=6.0.0",
    # LLM Integration
    "openai>=1.0.0",
    # Zep Cloud Knowledge Graph
    "zep-cloud==3.25.0",
    "httpx>=0.27.0",
    # OASIS Social Media Simulation
    "camel-oasis==0.2.5",
    "camel-ai==0.2.78",
    # Document Processing
    "PyMuPDF>=1.24.0",
    # Encoding detection (supporting non-UTF-8 text files)
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "gunicorn>=26.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pipreqs>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

