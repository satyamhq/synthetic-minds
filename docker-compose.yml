services:
  synthetic-minds:
    image: ghcr.io/satyamhq/synthetic-minds:latest
    container_name: synthetic-minds
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "3000:3000"
      - "5001:5001"
    restart: unless-stopped
    volumes:
      - ./backend/uploads:/app/backend/uploads